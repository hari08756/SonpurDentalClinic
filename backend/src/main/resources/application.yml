spring:
  application:
    name: sonpur-dental-clinic-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sonpur_clinic?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:8080}
app:
  cors:
    allowed-origins: "${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8081,http://127.0.0.1:8081,https://localhost,capacitor://localhost}"
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:ChangeMe@123}
  jwt:
    secret: ${JWT_SECRET:c29ucHVyLWRlbnRhbC1jbGluaWMtZGV2LXNlY3JldC1rZXktMjAyNi1jaGFuZ2UtbWU=}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  uploads:
    directory: ${UPLOAD_DIR:./uploads}
